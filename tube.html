<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>SJF - Tube</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
</head>
<body>
  <div id="site-header-container"></div>
  <div id="site-menu-container"></div>
  <main class="site-content">
    <div class="tube-container">
      
      <div class="tube-main-player">
        <div class="video-wrapper">
            
          <video id="main-video" src="videos/NandaLoop.mp4"></video>
          
          <div class="custom-controls">
            <button id="play-pause-btn" class="control-btn" title="Play/Pause">
              ▶
            </button>
            <span class="video-time" id="video-time">00:00 / 00:00</span>
          </div>
        </div>
        <h1 class="video-title">Animação da Nandinha - 01</h1>
      </div>
    </div>
  </main>
  <div id="site-footer-container"></div>
  <script src="js/layout.js"></script>
  <script src="js/tube.js"></script>
</body>
</html>
