<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login - SJF</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
</head>
<body>

  <div class="login-container">
    <h1 class="login-title">Login</h1>
    <p class="login-hint" id="hint-text"></p>

    <input type="text" id="password-input" class="login-input" placeholder="Digite aqui">
    <button id="login-button" class="login-button">Acessar</button>

    <p class="login-error" id="error-message">A senha inserida é inválida</p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
